name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # 可选：在仓库 Settings → Secrets and variables → Actions → Secrets 里添加 CLOUD_SERVER
      #（值 = 你的官方服务器地址，构建时注入客户端；Secret 加密存储、公开仓库不泄露）
      - name: Build (Tauri)
        run: npx tauri build
        env:
          CLOUD_SERVER: ${{ secrets.CLOUD_SERVER || vars.CLOUD_SERVER }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhaoxi-windows
          path: |
            src-tauri/target/release/simple-todo.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Release 附件用 ASCII 文件名（GitHub 会丢弃非 ASCII 附件名里的中文）
      - name: Stage release files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "src-tauri/target/release/simple-todo.exe" "release/zhaoxi-${{ github.ref_name }}-portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release/zhaoxi-${{ github.ref_name }}-setup.exe"

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "朝夕 ${{ github.ref_name }}"
          files: |
            release/*.exe
          generate_release_notes: true
