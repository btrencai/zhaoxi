# 朝夕云同步 · Nginx 反向代理参考
# 证书：certbot --nginx -d todo.example.com

server {
    listen 80;
    server_name todo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name todo.example.com;
    ssl_certificate     /etc/letsencrypt/live/todo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.example.com/privkey.pem;

    client_max_body_size 8m;
    proxy_read_timeout 30s;

    # 认证接口限流（需在 http{} 定义 limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;）
    location ~ ^/api/(register|login|wechat/qr)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
